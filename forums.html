
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,td,input,textarea,select,button{font-family:Verdana,Geneva,sans-serif;font-size:11px;color:#000}
.page{background:#c0c9d9;padding:8px}
.gbox{background:#e8ecf5;border:1px solid #9aaac0;margin-bottom:8px}
.ghead{background:#4a6ea8;color:#fff;font-weight:bold;padding:3px 8px;font-size:11px}
.gbody{padding:8px}
.trow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.trow label{font-size:10px;font-weight:bold;color:#222;min-width:68px}
.trow input{font-family:Verdana;font-size:11px;border:1px solid #999;padding:2px 4px;background:#fff;flex:1}
.pf{background:#f2f5fc;border:1px solid #b0bcd4;padding:7px 8px;margin-bottom:5px}
.pf-hd{font-size:10px;font-weight:bold;color:#4a6ea8;margin-bottom:5px}
.pf-layout{display:flex;gap:10px;flex-wrap:wrap}
.av-col{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;flex-shrink:0}
.av-drop{width:80px;height:90px;border:2px dashed #8a9ab8;background:#d4dae8;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.av-drop img.av-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.av-drop-txt{font-size:9px;color:#556;text-align:center;line-height:1.4;padding:4px;position:relative;z-index:1}
.av-drop.has-img .av-drop-txt{display:none}
input[type=file]{display:none}
.flds{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.fr{display:flex;align-items:flex-start;gap:5px}
.fr label{font-size:10px;font-weight:bold;color:#333;min-width:70px;padding-top:3px;flex-shrink:0}
.fr input,.fr textarea{font-family:Verdana;font-size:11px;border:1px solid #aaa;padding:2px 4px;background:#fff;flex:1}
.fr textarea{height:46px;resize:vertical}
.bdg-row{display:flex;gap:3px;flex-wrap:wrap}
.bopt{font-size:9px;border:1px solid #aaa;padding:1px 5px;cursor:pointer;background:#e4e4e4;font-family:Verdana;font-weight:bold}
.bopt.on{background:#4a6ea8;color:#fff;border-color:#2a4e88}
.btn{font-family:Verdana;font-size:11px;font-weight:bold;border:1px solid #7a8aaa;padding:3px 11px;cursor:pointer;background:#dce4f4}
.btn:hover{background:#c4ceea}
.btn-go{background:#4a6ea8;color:#fff;border-color:#2a4e88}
.btn-go:hover{background:#3a5e98}
.btn-sm{font-size:10px;padding:2px 7px}
.forum{background:#c0c9d9;border:1px solid #9aaac0}
.fbar{background:#4a6ea8;color:#fff;font-size:12px;font-weight:bold;padding:6px 10px;border-bottom:2px solid #2a4278}
.ftable{width:100%;border-collapse:collapse;table-layout:fixed}
.frow-tr{border-bottom:1px solid #8a9ab8;background:#e8ecf5}
.frow-tr:nth-child(odd){background:#edf3fb}
.frow-tr:last-child{border-bottom:none}
.fleft{width:118px;min-width:118px;vertical-align:top;background:#d0d8ec;border-right:1px solid #8a9ab8;padding:8px 7px}
.fright{vertical-align:top;background:#e8ecf5;padding:10px 12px}
.s-uname-row{display:flex;align-items:baseline;gap:2px}
.s-uname{color:#0000cc;font-weight:bold;font-size:11px;margin:0;cursor:pointer;text-decoration:none;word-break:break-word;overflow-wrap:anywhere;min-width:0}
.s-uname:hover{text-decoration:underline}
.s-avatar{width:70px;height:80px;border:1px solid #8a9ab8;background:#b8c4d8;overflow:hidden;margin:4px 0 0 0}
.s-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.s-avatar-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#888;background:#c4cede;text-align:center;line-height:1.4;padding:4px}
.badge-area{display:block;align-items:center;position:relative;margin:0 0 4px;}
.badge-hat{width:auto;height:auto;max-width:80px;max-height:50px;display:block;}
.badge-tag{display:none}
.badge-bc, .badge-obc, .badge-tbc, .badge-nbc{display:none}
.s-info{font-size:10px;color:#333;line-height:1.7}
.s-info br{display:block;margin:2px 0}
.s-grp{font-size:10px;color:#0000cc;cursor:pointer}
.s-grp:hover{text-decoration:underline}
.online-dot{flex-shrink:0;display:inline-block;width:8px;height:8px;border-radius:50%;background:#cc0000;margin-right:2px;position:relative;top:1px}
.ph-title{font-size:12px;font-weight:bold;color:#000;display:block;margin-bottom:2px}
.ph-date{font-size:10px;color:#555;display:block;margin-bottom:4px}
.ph-div{height:1px;background:#b8c2d8;margin:4px 0 8px}
.ph-msg{font-size:11px;color:#111;line-height:1.55;margin-bottom:10px}
.ph-footer{display:flex;align-items:center;gap:10px}
.post-reply-btn{display:inline-flex;align-items:center;gap:2px;padding:2px 9px;background:#eef1fb;border:1px solid #9aa7c3;border-radius:12px;font-size:10px;font-weight:bold;cursor:pointer;line-height:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);text-transform:none}
.post-reply-btn:hover{background:#e5ebf7}
.post-reply-icon{display:none}
.post-reply-word-post{color:#cc0000}
.post-reply-word-reply{color:#0047b8}
.rpt{font-size:10px;color:#0000cc;cursor:pointer}
.rpt:hover{text-decoration:underline}

/* ── generator-panel helpers shared by both eras ── */
.trow label.ck{min-width:0;font-weight:normal;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
.fr label.ckf{min-width:0;font-weight:normal;padding-top:0;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer}
.fr .ck-group{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap;padding-top:2px}
.trow input.narrow{flex:0 1 130px;min-width:80px}

/* ════════════════════════════════════════════════════════════════════
   2015 forum skin.
   Colours/metrics taken from the archived roblox.com stylesheets:
     /Forum/skins/default/style/default.css   (Wayback 2016-01-01)
     main___*.css                             (Wayback 2014-12-12)
   Post body colour is the maroon from the reference screenshots rather
   than the #000 the real skin used — tweak --f15-msg to go authentic.
   ════════════════════════════════════════════════════════════════════ */
.f15{--f15-msg:#7a2828;background:#fff;padding:12px 14px 16px;font-family:'Source Sans Pro',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.428;color:#343434}
/* Two things fight the 2015 typography: the page-wide `body,td,...{Verdana
   11px}` rule beats inheritance into cells, and this document has no doctype,
   so in quirks mode a <table> does not inherit font from its parent at all.
   Restate the type on the table and let the cells inherit from there. */
.f15 td{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
.f15 a{color:#095fb5;text-decoration:none}
.f15 a:hover{text-decoration:underline}

.f15-crumbrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.f15-crumbs a{font-weight:bold;color:#095fb5}
.f15-sep{font-weight:bold;color:#000}
.f15-nav{white-space:nowrap;text-align:right}
.f15-nav a{padding:0 5px;border-left:1px solid #000;font-weight:600;color:#343434}
.f15-nav a:first-child{border-left:none;padding-left:0}
.f15-nav a:last-child{padding-right:0}

.f15-title{display:block;font-size:30px;font-weight:normal;color:#343434;letter-spacing:-1px;line-height:1.15;margin:18px 0 20px;word-wrap:break-word}
.f15-sortrow{text-align:right;margin-bottom:5px;font-size:14px;font-weight:bold;color:#000}
/* faux <select>: real selects rasterise badly through html2canvas */
.f15-sel{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:132px;border:1px solid #0058b1;background:#fff;color:#000;font-weight:normal;font-size:13px;line-height:18px;padding:1px 5px;vertical-align:middle}
.f15-sel-arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #555;flex-shrink:0}

/* cellspacing="1" on table.tableBorder; .tableBorder set no background of its
   own, so the 1px gutters showed the white page through. Only the explicit
   flatViewSpacing row reads as a visible rule. */
.f15-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:1px;background:#fff;font-family:'Source Sans Pro',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.428;color:#343434}
.f15-headcell{background:#bdd6f5;padding:0}
.f15-bar{background:#2d528f;color:#fff;text-align:right;padding:5px 8px;font-size:20px;font-weight:normal;line-height:1.2}
.f15-bar a{color:#fff;font-size:20px;font-weight:normal}
.f15-bar a:hover{text-decoration:none}
.f15-bar .f15-dc{font-size:14px;font-weight:bold;color:#fff;padding:0 6px}
.f15-col-user{width:150px}
.f15-spacer{height:1px;padding:0;font-size:0;line-height:0;background:#d8d8d8}

.f15-left{width:150px;vertical-align:top;background:#f9f9f9;padding:3px 3px 3px 4px;white-space:nowrap;overflow:hidden}
.f15-right{vertical-align:top;background:#f9f9f9;padding:3px}
.f15-row{padding:1px 0}
.f15-uname{font-weight:bold;color:#095fb5;font-size:14px}
.f15-uname.mod{color:#00008b}
.f15-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c40000;margin-right:4px;vertical-align:baseline}
.f15-dot.on{background:#22a012}
.f15-av{position:relative;display:block;width:100px;height:100px;margin:2px 0}
.f15-av img.f15-av-img{display:block;width:100px;height:100px;border:0;object-fit:cover}
.f15-av-empty{width:100px;height:100px;border:1px solid #dcdcdc;background:#f2f2f2;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;font-size:11px;line-height:1.35;color:#999;padding:4px}
.f15-bcov{position:absolute;left:0;bottom:0;display:block;border:0;max-width:100px}
.f15-mod img{display:block;border:0;margin:1px 0}
.f15-meta{font-size:.9em;color:#000}
.f15-grp{font-size:.9em;min-height:19px;max-width:143px;overflow:hidden;text-overflow:ellipsis}

.f15-date{font-size:.9em;color:#000;padding:3px}
.f15-msg{font-size:1em;color:var(--f15-msg);padding:3px;min-height:125px;white-space:pre-wrap;overflow:hidden;word-wrap:break-word;overflow-wrap:anywhere}
.f15-msg a{color:#095fb5}
/* .post-response-options was display:none until .forum-post:hover */
.f15-actions{height:29px;text-align:right;padding:3px;display:flex;align-items:center;justify-content:flex-end;gap:8px;visibility:hidden}
.f15-post:hover .f15-actions{visibility:visible}
.f15-reply{display:inline-block;border:1px solid #b6b6b6;border-radius:3px;background:linear-gradient(#fff,#e6e6e6);color:#000;font-size:13px;line-height:18px;padding:1px 12px;cursor:pointer}
.f15-abuse{font-size:.9em;cursor:pointer}
</style>

<div class="page">
<div class="gbox">
  <div class="ghead">ROBLOX Forum Generator — <span id="ghead-era">2012</span><span style="float:right;font-weight:normal;opacity:.8">v1.2</span></div>
  <div class="gbody">
    <div class="trow"><label>Era</label>
      <div class="bdg-row" id="era-row">
        <button class="bopt on" data-era="2012" onclick="selEra('2012')">2012</button>
        <button class="bopt" data-era="2015" onclick="selEra('2015')">2015</button>
      </div>
    </div>
    <div class="trow"><label>Thread title</label><input id="ttl" value="MINISH, #1 DARKHEART!???"></div>
    <div class="era-2015-only" style="display:none">
      <div class="trow"><label>Breadcrumb</label>
        <input id="c15-cb1" class="narrow" value="ROBLOX Forum">
        <input id="c15-cb2" class="narrow" value="Roblox">
        <input id="c15-cb3" value="Help (Technical Support and Account Issues)">
      </div>
      <div class="trow"><label>Sort label</label>
        <input id="c15-sorttxt" class="narrow" value="Oldest to newest">
        <label class="ck"><input type="checkbox" id="c15-crumbs" checked> Breadcrumb</label>
        <label class="ck"><input type="checkbox" id="c15-nav" checked> Home | Search</label>
        <label class="ck"><input type="checkbox" id="c15-sort" checked> Sort dropdown</label>
      </div>
    </div>
    <div id="pforms"></div>
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center">
      <button class="btn" onclick="addPost()">+ Add reply</button>
      <button class="btn btn-go" onclick="generate()">Generate thread</button>
      <button class="btn" onclick="downloadThreadImage()">Download Image</button>
      <input id="save-name" type="text" placeholder="Save name" style="flex:1;min-width:180px;padding:4px 8px;border:1px solid #999;background:#fff;color:#000">
      <button class="btn" onclick="saveCurrent()">Save</button>
      <select id="save-list" style="padding:4px 8px;border:1px solid #999;background:#fff;color:#000;min-width:180px">
        <option value="">Load saved thread</option>
      </select>
      <button class="btn" onclick="loadSelected()">Load</button>
      <button class="btn" onclick="deleteSelected()">Delete</button>
    </div>
    <div id="save-message" style="font-size:10px;color:#004400;margin-top:6px"></div>
  </div>
</div>
<div id="fout" style="display:none">
  <div id="out-2012">
    <div class="forum">
      <div class="fbar" id="fbar"></div>
      <table class="ftable"><tbody id="ftbody"></tbody></table>
    </div>
  </div>
  <div id="out-2015" class="f15" style="display:none"></div>
</div>
</div>

<script>
const BC_BADGE  = {src:'BC.png'};
const OBC_BADGE = {src:'OBC.png'};
const TBC_BADGE = {src:'TBC.jpg'};
// Moderator badge (use uploaded image file)
const MOD_BADGE = {src:'moderator.png'};

const POST_REPLY_SVG = `<svg class="post-reply-icon" viewBox="0 0 22 16" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="22" height="16" rx="2" fill="#c0cce0" stroke="#8899aa" stroke-width="1"/>
  <polygon points="4,8 9,4 9,6 14,6 14,10 9,10 9,12" fill="#336699"/>
</svg>`;

let posts=[],pid=0;
const DEFS=[
  {un:'coolboy10000',badge:'OBC',jd:'07 Jul 2008',tp:'7776',grp:'Christians of R...',msg:'Please offer. U wanted #1 or #100 (if ur really Telamon)',dt:'04-01-2012 03:13 PM'},
  {un:'walt999',badge:'BC',jd:'16 Aug 2007',tp:'4861',grp:'LMaD SNIPERS',msg:"coolboy's chance finally xD",dt:'04-01-2012 03:13 PM'},
  {un:'BlueBed',badge:'BC',jd:'06 Jun 2011',tp:'563',grp:'',msg:"I'll buy for 562,836?",dt:'04-01-2012 03:13 PM'},
];
const BADGES=['None','BC','TBC','OBC','NBC'];
/* Date format the era's forum actually printed, used for fresh posts. */
const ERA_DATE={'2012':'04-01-2012 03:13 PM','2015':'16 Nov 2015 11:43 PM'};

function getEra(){
  const el=document.querySelector('#era-row .bopt.on');
  return el?el.dataset.era:'2012';
}

function threadIsOnScreen(){
  return document.getElementById('fout').style.display!=='none';
}

/* rerender=false while loading a save: the posts have not been rebuilt yet,
   so regenerating here would paint the outgoing thread. */
function selEra(era,rerender=true){
  document.querySelectorAll('#era-row .bopt').forEach(b=>b.classList.toggle('on',b.dataset.era===era));
  document.getElementById('ghead-era').textContent=era;
  document.querySelectorAll('.era-2015-only').forEach(el=>{el.style.display=era==='2015'?'':'none'});
  // Keep a thread that's already on screen in sync with the era just picked.
  if(rerender && threadIsOnScreen()) generate();
}

const BADGE_SRC={BC:BC_BADGE.src,TBC:TBC_BADGE.src,OBC:OBC_BADGE.src,NBC:null};

function getBadgeSrc(badge){
  if(!badge||badge==='None')return null;
  return BADGE_SRC[badge]||null;
}

function getBadgeHTML(badge){
  const src=getBadgeSrc(badge);if(!src)return'';
  return`<div class="badge-area"><img class="badge-hat" src="${src}" alt="${badge} badge"></div>`;
}

function getModHTML(isMod){
  if(!isMod) return '';
  return `<div class="badge-area"><img class="badge-hat" src="${MOD_BADGE.src}" alt="moderator"></div>`;
}

function addPost(def){
  if(pid>=6){alert('Max 6 posts');return}
  const id=pid++;
  const d=def||DEFS[id]||{un:'user'+id,badge:'None',jd:'01 Jan 2010',tp:'100',grp:'',msg:'',dt:ERA_DATE[getEra()]};
  posts.push({id,img:null});
  const div=document.createElement('div');
  div.className='pf';div.id='pf-'+id;
  div.innerHTML=`<div class="pf-hd">${id===0?'Original Post':'Reply '+id}</div>
<div class="pf-layout">
  <div class="av-col">
    <div class="av-drop" id="avd-${id}" onclick="document.getElementById('fi-${id}').click()">
      <div class="av-drop-txt">Click to upload<br>your ROBLOX<br>avatar image</div>
    </div>
    <input type="file" id="fi-${id}" accept="image/*" onchange="loadImg(${id},this)">
    <div id="avs-${id}" style="font-size:9px;color:#668;text-align:center;margin-top:2px"></div>
  </div>
  <div class="flds">
    <div class="fr"><label>Username</label><input id="un-${id}" value="${d.un}"></div>
    <div class="fr"><label>Badge</label>
      <div class="bdg-row" id="br-${id}">
        ${BADGES.map(b=>`<button class="bopt${b===d.badge?' on':''}" onclick="selBadge(${id},'${b}')">${b}</button>`).join('')}
      </div>
    </div>
    <div class="fr"><label>Join date</label><input id="jd-${id}" value="${d.jd}"></div>
    <div class="fr"><label>Total posts</label><input id="tp-${id}" value="${d.tp}"></div>
    <div class="fr"><label>Group</label><input id="grp-${id}" value="${d.grp}"></div>
    <div class="fr"><label>Date/time</label><input id="dt-${id}" value="${d.dt}"></div>
    <div class="fr"><label>Flags</label>
      <div class="ck-group">
        <label class="ckf"><input type="checkbox" id="mod-${id}"> Moderator</label>
        <label class="ckf"><input type="checkbox" id="on-${id}"> Online</label>
      </div>
    </div>
    <div class="fr"><label>Message</label><textarea id="msg-${id}">${d.msg}</textarea></div>
  </div>
</div>
<div style="text-align:right;margin-top:5px"><button class="btn btn-sm" onclick="rmPost(${id})">Remove</button></div>`;
  document.getElementById('pforms').appendChild(div);
}

function loadImg(id,inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    posts.find(p=>p.id===id).img=e.target.result;
    const d=document.getElementById('avd-'+id);
    d.classList.add('has-img');
    let im=d.querySelector('img.av-img');
    if(!im){im=document.createElement('img');im.className='av-img';d.appendChild(im)}
    im.src=e.target.result;
    document.getElementById('avs-'+id).textContent='Uploaded!';
  };
  r.readAsDataURL(f);
}

function selBadge(id,v){
  document.querySelectorAll('#br-'+id+' .bopt').forEach(b=>b.classList.toggle('on',b.textContent===v));
}
function getBadge(id){const el=document.querySelector('#br-'+id+' .bopt.on');return el?el.textContent:'None'}
function rmPost(id){document.getElementById('pf-'+id)?.remove();const i=posts.findIndex(p=>p.id===id);if(i>-1)posts.splice(i,1)}

/* Read one post's editor fields. Shared by the renderers and by saving. */
function readPost(p){
  const id=p.id;
  return {
    img:p.img||null,
    un:document.getElementById('un-'+id)?.value||'',
    badge:getBadge(id),
    jd:document.getElementById('jd-'+id)?.value||'',
    tp:document.getElementById('tp-'+id)?.value||'',
    grp:document.getElementById('grp-'+id)?.value||'',
    dt:document.getElementById('dt-'+id)?.value||'',
    isMod:document.getElementById('mod-'+id)?.checked||false,
    online:document.getElementById('on-'+id)?.checked||false,
    msg:document.getElementById('msg-'+id)?.value||''
  };
}

function generate(){
  const era=getEra();
  const title=document.getElementById('ttl').value||'Thread';
  const data=posts.map(readPost);
  if(era==='2015') render2015(title,data); else render2012(title,data);
  document.getElementById('out-2012').style.display=era==='2012'?'':'none';
  document.getElementById('out-2015').style.display=era==='2015'?'':'none';
  document.getElementById('fout').style.display='block';
  document.getElementById('fout').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function render2012(title,data){
  document.getElementById('fbar').textContent=title;
  const tb=document.getElementById('ftbody');
  tb.innerHTML='';
  data.forEach((d,i)=>{
    const msg=d.msg.replace(/\n/g,'<br>');
    const ptitle=i===0?title:'Re: '+title;
    const avHTML=d.img?`<img src="${d.img}">`:`<div class="s-avatar-empty">Upload<br>avatar<br>image</div>`;
    const tr=document.createElement('tr');
    tr.className='frow-tr';
    tr.innerHTML=`<td class="fleft">
  <div class="s-uname-row"><span class="online-dot"${d.online?' style="background:#22a012"':''}></span><span class="s-uname">${d.un}</span></div>
  <div class="s-avatar">${avHTML}</div>
  ${getModHTML(d.isMod)}${getBadgeHTML(d.badge)}
  <div class="s-info">Joined: ${d.jd}<br>Total Posts: ${d.tp}${d.grp?`<br><span class="s-grp">+ ${d.grp}</span>`:''}</div>
</td>
<td class="fright">
  <span class="ph-title">${ptitle}</span>
  <span class="ph-date">Posted: ${d.dt}</span>
  <div class="ph-div"></div>
  <div class="ph-msg">${msg}</div>
  <div class="ph-footer">
    <span class="post-reply-btn"><span class="post-reply-word-post">post</span><span class="post-reply-word-reply">reply</span></span>
    <span class="rpt">Report Abuse</span>
  </div>
</td>`;
    tb.appendChild(tr);
  });
}

/* 2015 layout: one <h2> for the whole thread (no per-post "Re:" title),
   date at the top of the message cell, BC badge overlaid on the avatar's
   bottom-left corner, and the Previous/Next bar repeated top and bottom. */
function render2015(title,data){
  const c=readChrome2015();
  const bar=`<div class="f15-bar"><a href="#" onclick="return false">Previous Thread</a><span class="f15-dc">::</span><a href="#" onclick="return false">Next Thread</a></div>`;
  let h='';

  if(c.showCrumbs||c.showNav){
    const crumbs=c.showCrumbs
      ? [c.cb1,c.cb2,c.cb3].filter(s=>s.trim()!=='')
          .map(s=>`<a href="#" onclick="return false">${s}</a>`)
          .join('<span class="f15-sep"> &raquo; </span>')
      : '';
    const nav=c.showNav
      ? `<div class="f15-nav"><a href="#" onclick="return false">Home</a><a href="#" onclick="return false">Search</a></div>`
      : '';
    h+=`<div class="f15-crumbrow"><div class="f15-crumbs">${crumbs}</div>${nav}</div>`;
  }

  h+=`<h2 class="f15-title">${title}</h2>`;
  if(c.showSort){
    h+=`<div class="f15-sortrow">Sort: <span class="f15-sel">${c.sortTxt}<span class="f15-sel-arrow"></span></span></div>`;
  }

  // The first row is a colspan=2 bar, so table-layout:fixed needs an explicit
  // colgroup to pin the 150px user column.
  h+=`<table class="f15-table"><colgroup><col class="f15-col-user"><col></colgroup><tbody>`;
  h+=`<tr><td class="f15-headcell" colspan="2">${bar}</td></tr>`;
  data.forEach((d,i)=>{
    if(i>0) h+=`<tr><td class="f15-spacer" colspan="2"></td></tr>`;
    h+=post2015(d);
  });
  h+=`<tr><td class="f15-spacer" colspan="2"></td></tr>`;
  h+=`<tr><td class="f15-headcell" colspan="2">${bar}</td></tr>`;
  h+=`</tbody></table>`;

  document.getElementById('out-2015').innerHTML=h;
}

function post2015(d){
  const av=d.img
    ? `<img class="f15-av-img" src="${d.img}" alt="${d.un}">`
    : `<div class="f15-av-empty">Upload avatar image</div>`;
  const ov=getBadgeSrc(d.badge);
  return `<tr class="f15-post">
  <td class="f15-left">
    <div class="f15-row"><span class="f15-dot${d.online?' on':''}"></span><a class="f15-uname${d.isMod?' mod':''}" href="#" onclick="return false">${d.un}</a></div>
    <div class="f15-row"><span class="f15-av">${av}${ov?`<img class="f15-bcov" src="${ov}" alt="${d.badge}">`:''}</span></div>
    ${d.isMod?`<div class="f15-row f15-mod"><img src="${MOD_BADGE.src}" alt="Forum Moderator"></div>`:''}
    <div class="f15-row f15-meta"><b>Joined:</b> ${d.jd}</div>
    <div class="f15-row f15-meta"><b>Total Posts: </b>${d.tp}</div>
    <div class="f15-row f15-grp">${d.grp?`<a href="#" onclick="return false">${d.grp}</a>`:'&nbsp;'}</div>
  </td>
  <td class="f15-right">
    <div class="f15-date">${d.dt}</div>
    <div class="f15-msg">${d.msg}</div>
    <div class="f15-actions"><span class="f15-reply">Reply</span><a class="f15-abuse" href="#" onclick="return false">Report Abuse</a></div>
  </td>
</tr>`;
}

function readChrome2015(){
  const v=id=>document.getElementById(id)?.value||'';
  const ck=id=>document.getElementById(id)?.checked||false;
  return {
    cb1:v('c15-cb1'), cb2:v('c15-cb2'), cb3:v('c15-cb3'),
    sortTxt:v('c15-sorttxt'),
    showCrumbs:ck('c15-crumbs'), showNav:ck('c15-nav'), showSort:ck('c15-sort')
  };
}

function applyChrome2015(c){
  if(!c) return;
  const set=(id,val)=>{const el=document.getElementById(id);if(el&&val!==undefined)el.value=val};
  const chk=(id,val)=>{const el=document.getElementById(id);if(el&&val!==undefined)el.checked=val};
  set('c15-cb1',c.cb1); set('c15-cb2',c.cb2); set('c15-cb3',c.cb3);
  set('c15-sorttxt',c.sortTxt);
  chk('c15-crumbs',c.showCrumbs); chk('c15-nav',c.showNav); chk('c15-sort',c.showSort);
}

const STORAGE_KEY = 'bensutils_forum_saves';

function getSavedSaves(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}

function persistSaves(saves){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(saves));
}

function updateSaveList(){
  const list=document.getElementById('save-list');
  const saves=getSavedSaves();
  const selected=list.value;
  list.innerHTML='<option value="">Load saved thread</option>';
  Object.keys(saves).sort().forEach(name=>{
    const option=document.createElement('option');
    option.value=name; option.textContent=name;
    list.appendChild(option);
  });
  if(selected && saves[selected]) list.value=selected;
}

function showSaveMessage(text,color='#004400'){
  const el=document.getElementById('save-message');
  el.textContent=text;
  el.style.color=color;
}

function readCurrentState(){
  const title=document.getElementById('ttl').value||'';
  return {title,era:getEra(),chrome:readChrome2015(),currentPosts:posts.map(readPost)};
}

function saveCurrent(){
  const name=document.getElementById('save-name').value.trim();
  if(!name){showSaveMessage('Enter a save name before saving.', '#a00');return}
  const saves=getSavedSaves();
  saves[name]=readCurrentState();
  persistSaves(saves);
  updateSaveList();
  showSaveMessage(`Saved thread “${name}”.`);
}

function loadSelected(){
  const list=document.getElementById('save-list');
  const name=list.value;
  if(!name){showSaveMessage('Select a saved thread to load.', '#a00');return}
  const saves=getSavedSaves();
  const data=saves[name];
  if(!data){showSaveMessage('Saved thread not found.', '#a00');return}
  loadSave(data);
  showSaveMessage(`Loaded thread “${name}”.`);
}

function deleteSelected(){
  const list=document.getElementById('save-list');
  const name=list.value;
  if(!name){showSaveMessage('Select a saved thread to delete.', '#a00');return}
  const saves=getSavedSaves();
  if(!saves[name]){showSaveMessage('Saved thread not found.', '#a00');return}
  delete saves[name];
  persistSaves(saves);
  updateSaveList();
  showSaveMessage(`Deleted save “${name}”.`);
}

function loadSave(data){
  posts=[]; pid=0;
  const container=document.getElementById('pforms');
  container.innerHTML='';
  document.getElementById('ttl').value=data.title||'';
  // Saves written before the era toggle existed are all 2012 threads.
  selEra(data.era==='2015'?'2015':'2012',false);
  applyChrome2015(data.chrome);
  data.currentPosts.forEach(post=>{
    addPost({
      un:post.un,
      badge:post.badge,
      jd:post.jd,
      tp:post.tp,
      grp:post.grp,
      dt:post.dt,
      msg:post.msg
    });
    const id = posts[posts.length-1].id;
    if(post.img){
      posts.find(p=>p.id===id).img = post.img;
      const d=document.getElementById('avd-'+id);
      d.classList.add('has-img');
      const im=document.createElement('img');
      im.className='av-img';
      im.src=post.img;
      d.appendChild(im);
      document.getElementById('avs-'+id).textContent='Uploaded!';
    }
    document.getElementById('mod-'+id).checked=!!post.isMod;
    document.getElementById('on-'+id).checked=!!post.online;
  });
  // Refresh an already-visible thread so it shows what was just loaded.
  if(threadIsOnScreen()) generate();
}

updateSaveList();
addPost();addPost();addPost();

/* ════ Download whole thread as PNG ════ */
async function downloadThreadImage(){
  const msg = document.getElementById('save-message');
  if(typeof html2canvas === 'undefined'){
    msg.style.color='#a00';
    msg.textContent='Capture library failed to load — check your internet connection.';
    return;
  }
  // Make sure the rendered thread reflects the latest inputs first.
  generate();
  const node = document.getElementById('fout');
  msg.style.color='#004400';
  msg.textContent='Rendering image…';
  try{
    // 2015 mode is laid out in Source Sans Pro; capturing before the webfont
    // arrives bakes the Arial fallback into the PNG.
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    // Capture the thread at the width it actually occupies on screen so the
    // fixed-layout table isn't stretched to the full viewport during render.
    const rect = node.getBoundingClientRect();
    const canvas = await html2canvas(node, {
      backgroundColor:'#ffffff',
      scale: Math.min(window.devicePixelRatio || 1, 2),
      useCORS:true,
      logging:false,
      width: Math.ceil(rect.width),
      height: Math.ceil(rect.height),
      scrollX: 0,
      scrollY: 0
    });
    const ttl = (document.getElementById('ttl').value || 'thread')
      .replace(/[^a-z0-9_-]+/gi,'_').slice(0,40) || 'thread';
    const link = document.createElement('a');
    link.download = 'roblox-forum-' + getEra() + '-' + ttl + '.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    link.remove();
    msg.textContent='Image downloaded!';
  }catch(err){
    msg.style.color='#a00';
    msg.textContent='Could not generate image: ' + (err && err.message ? err.message : err);
  }
}
